{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock"></i> TechStock Auth</h4>
                <small class="text-white-50">Controle de Acesso Operacional (RBAC)</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail Corporativo</label>
                        <input type="email" name="email" class="form-control" placeholder="ex: operador@techstore.com" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Senha de Acesso</label>
                        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Acessar Terminal</button>
                </form>
                <div class="mt-4 p-3 bg-light rounded border small">
                    <div class="fw-bold text-muted mb-1">Credenciais Padrão de Homologação:</div>
                    <div><strong>Operador:</strong> <code>operador@techstore.com</code> | <code>senha123</code></div>
                    <div><strong>Gerente:</strong> <code>gerente@techstore.com</code> | <code>senha123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
