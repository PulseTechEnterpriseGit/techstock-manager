{% extends "base.html" %}
{% block content %}
<div style="max-width: 380px; margin: 5rem auto;" class="card">
    <h2 style="text-align: center; margin-bottom: 0.25rem;">TechStock Manager</h2>
    <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Acesso Corporativo</p>
    <form method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label>E-mail</label>
            <input type="email" name="email" required placeholder="usuario@techstore.com">
        </div>
        <div>
            <label>Senha</label>
            <input type="password" name="senha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">Entrar</button>
    </form>
</div>
{% endblock %}
