{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 720px; margin: 0 auto;">
    <h2>Cadastrar Novo Produto</h2>
    <form method="POST" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div>
            <label>Codigo SKU</label>
            <input type="text" name="sku" placeholder="Ex: SSD-1TB-NVME" required>
        </div>
        <div>
            <label>Nome do Produto</label>
            <input type="text" name="nome" placeholder="Ex: SSD NVMe 1TB" required>
        </div>
        <div>
            <label>Tipo de Produto</label>
            <select name="tipo" required>
                <option value="fisico">Fisico (Com Controle de Estoque)</option>
                <option value="digital">Digital (Chave de Licenca)</option>
            </select>
        </div>
        <div>
            <label>Preco Unitario (R$)</label>
            <input type="number" step="0.01" name="preco" placeholder="0.00" required>
        </div>
        <div>
            <label>Estoque Inicial (Fisico)</label>
            <input type="number" name="estoque_atual" value="10">
        </div>
        <div>
            <label>Estoque Minimo de Alerta</label>
            <input type="number" name="estoque_minimo" value="5">
        </div>
        <div>
            <label>Categoria</label>
            <select name="categoria_id" required>
                {% for c in categorias %}<option value="{{ c['id'] }}">{{ c['nome'] }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label>Fornecedor</label>
            <select name="fornecedor_id" required>
                {% for f in fornecedores %}<option value="{{ f['id'] }}">{{ f['nome'] }}</option>{% endfor %}
            </select>
        </div>
        <div style="grid-column: span 2;">
            <label>Chave Digital / Serial (apenas se for produto digital)</label>
            <input type="text" name="chave_digital" placeholder="Ex: XXXX-XXXX-XXXX-XXXX">
        </div>
        <div style="grid-column: span 2; display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.5rem;">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Produto</button>
        </div>
    </form>
</div>
{% endblock %}
